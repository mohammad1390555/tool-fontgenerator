<script>
"use strict";
var DATA=JSON.parse(document.getElementById("styles-data").textContent);
var LATIN=DATA.latin,CHARMAPS=DATA.charmaps,PAIRS=DATA.pairs;
var mode="fa",input=document.getElementById("input"),list=document.getElementById("list");
function toast(m){var t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(function(){t.classList.remove("show")},1200)}
function copyText(s){
 function fb(){var ta=document.createElement("textarea");ta.value=s;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");toast("کپی شد ✓")}catch(e){}document.body.removeChild(ta)}
 if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(s).then(function(){toast("کپی شد ✓")},fb)}else fb()
}
function strToFancyFa(t){
 if(!t)return"";
 t=t.replace(/[آرزواذژد]/g,function(c){return c+"~~ "});
 t=t.replace(/ ک /g," ڪ ").replace(/ س /g," ๛ ").replace(/ی /g,"ے ").replace(/ه /g,"ـہ ");
 t=t.replace(/ ف /g," ف ").replace(/ ف/g," ؋ـ").replace(/ف /g,"ـ؋ ").replace(/ف/g,"ـ؋ـ");
 t=t.replace(/ د/g," ב").replace(/د/g,"ـב").replace(/ و /g," פּ ").replace(/ ن /g," ט ");
 return t.replace(/~~ /g,"")
}
function applyMap(t,map){var out="";for(var i=0;i<t.length;i++){out+=(map[t[i]]!==undefined?map[t[i]]:t[i])}return out}
function tashkeel(t,mk){return t.replace(/([^\s])/g,"$1"+mk)}
function toEn(t,idx){
 var out="";
 for(var i=0;i<t.length;i++){
  var c=t[i],lo=c.toLowerCase();
  if(/[a-z]/.test(lo)&&LATIN[idx]&&LATIN[idx][lo]!==undefined)out+=LATIN[idx][lo];
  else out+=c
 }
 return out
}
function buildFA(text){
 var res=[],nm=[];
 CHARMAPS.forEach(function(m,i){res.push(applyMap(text,m));nm.push("فارسی خاص "+(i+1))});
 var fancy=strToFancyFa(text);
 res.push(fancy);nm.push("فارسی شکسته");
 res.push(tashkeel(fancy,"ّ"));nm.push("تشدیددار");
 res.push(tashkeel(fancy,"َِ"));nm.push("حرکت‌دار");
 res.push(tashkeel(fancy,"̸"));nm.push("اسلش‌دار");
 res.push(text.replace(/ /g,""));nm.push("چسبیده");
 res.push(fancy.replace(/ /g,""));nm.push("چسبیده شکسته");
 PAIRS.forEach(function(p,i){res.push(p[0]+fancy+p[1]);nm.push("تزئینی "+(i+1))});
 return {list:res,names:nm}
}
function buildEN(text){
 var res=[],nm=[];
 var names=["دایره‌ای","دایره‌ای ۲","یونانی","فول‌ویدث","فول‌ویدث ۲","خشن","ژاپنی","یونانی ۲","تای","یونانی ۳","اسپانیایی","وین‌لند","گوتیک","گوتیک بولد","اسکریپت","اسکریپت بولد","ایتالیک","ایتالیک بولد","دابل‌لاین","دابل‌لاین ۲","بالانویس"];
 for(var i=0;i<LATIN.length;i++){res.push(toEn(text,i));nm.push(names[i]||("استایل "+(i+1)))}
 var flipMap={a:"ɐ",b:"q",c:"ɔ",d:"p",e:"ǝ",f:"ɟ",g:"ƃ",h:"ɥ",i:"ᴉ",j:"ɾ",k:"ʞ",l:"l",m:"ɯ",n:"u",o:"o",p:"d",q:"b",r:"ɹ",s:"s",t:"ʇ",u:"n",v:"ʌ",w:"ʍ",x:"x",y:"ʎ",z:"z","?":"¿","!":"¡",".":"˙",",":"'","'":",","(":")",")":"("};
 var flipped="";for(var j=text.length-1;j>=0;j--){var ch=text[j].toLowerCase();flipped+=(flipMap[ch]!==undefined?flipMap[ch]:text[j])}
 res.push(flipped);nm.push("برعکس");
 res.push(text.toUpperCase().split("").join(" "));nm.push("فاصله‌دار");
 res.push(text.split("").join("̶"));nm.push("خط‌خورده");
 res.push("×͜× "+text+" ×͜×");nm.push("برات تزئینی");
 res.push("༺ "+text+" ༻");nm.push("تاج‌دار");
 return {list:res,names:nm}
}
function render(){
 var text=input.value.trim()||"پناهان نت";
 var b=mode==="fa"?buildFA(text):buildEN(text);
 var html="";
 for(var i=0;i<b.list.length;i++){
  var t=b.list[i];
  if(!t||!t.trim())continue;
  html+='<div class="font-box"><div class="txt">'+t.replace(/</g,"&lt;")+'</div><div class="nm">'+b.names[i]+"</div></div>"
 }
 list.innerHTML=html;
 var vis=list.querySelectorAll(".font-box").length;
 document.getElementById("cnt").textContent=vis;
 Array.prototype.forEach.call(list.children,function(el){
  el.addEventListener("click",function(){copyText(el.querySelector(".txt").textContent);
   el.classList.add("copied");setTimeout(function(){el.classList.remove("copied")},700)})
 })
}
document.getElementById("tab-fa").addEventListener("click",function(){mode="fa";this.classList.add("on");document.getElementById("tab-en").classList.remove("on");render()});
document.getElementById("tab-en").addEventListener("click",function(){mode="en";this.classList.add("on");document.getElementById("tab-fa").classList.remove("on");render()});
input.addEventListener("input",render);
render();
</script>

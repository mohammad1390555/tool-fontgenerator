*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:
    radial-gradient(900px 420px at 85% -60px, rgba(110,168,255,.14), transparent 60%),
    radial-gradient(700px 400px at 10% -40px, rgba(180,140,255,.12), transparent 60%),
    var(--bg);
  color:var(--tx);
  font-family:ui-sans-serif,system-ui,'Segoe UI',Tahoma,sans-serif;
  min-height:100vh;display:flex;justify-content:center;padding:0 14px 40px;
}
.wrap{width:100%;max-width:820px;position:relative}
/* ── lang toggle ── */
.lang-btn{
  position:absolute;top:30px;left:8px;z-index:60;
  background:var(--card);border:1px solid var(--line);color:var(--ac);
  border-radius:99px;padding:6px 14px;font-size:.8rem;font-weight:800;cursor:pointer;
  font-family:inherit;transition:.15s;letter-spacing:.5px;
}
.lang-btn:hover{border-color:var(--line-h);background:var(--card-h)}
[dir=ltr] .lang-btn{left:auto;right:8px}
/* ── header ── */
.hero{padding:38px 4px 22px;text-align:center}
.logo{display:inline-flex;align-items:center;gap:10px;font-size:1.7rem;font-weight:800;letter-spacing:-.5px;text-decoration:none;color:var(--tx)}
.logo .ic{width:44px;height:44px;border-radius:13px;background:var(--grad);display:grid;place-items:center;font-size:1.35rem;box-shadow:0 8px 24px rgba(110,168,255,.35)}
.logo b{background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.tagline{color:var(--tx2);font-size:.92rem;margin-top:10px;line-height:1.9}
.tagline b{color:var(--tx)}
.stats{display:flex;justify-content:center;gap:8px;margin-top:14px;flex-wrap:wrap}
.stat{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:5px 14px;font-size:.78rem;color:var(--tx2)}
.stat b{color:var(--ac);font-weight:700}
/* ── editor panel ── */
.panel{
  background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02));
  border:1px solid var(--line);border-radius:20px;padding:16px;
  box-shadow:0 20px 60px rgba(0,0,0,.45);
  position:sticky;top:12px;z-index:50;backdrop-filter:blur(14px);
}
.tabs{display:flex;gap:6px;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:12px}
.tabs button{flex:1;border:none;background:transparent;color:var(--tx2);border-radius:9px;padding:9px;font-size:.92rem;font-weight:700;font-family:inherit;cursor:pointer;transition:.18s;display:flex;align-items:center;justify-content:center;gap:7px}
.tabs button .b{font-size:.68rem;background:rgba(255,255,255,.08);border-radius:99px;padding:1px 8px;color:var(--tx3);font-weight:600}
.tabs button.on{background:var(--grad);color:#0b0e1a;box-shadow:0 4px 14px rgba(110,168,255,.35)}
.tabs button.on .b{background:rgba(0,0,0,.22);color:#0b0e1a}
textarea{
  width:100%;min-height:88px;background:rgba(0,0,0,.3);border:1px solid var(--line);
  border-radius:14px;color:var(--tx);padding:14px 16px;font-size:1.08rem;font-weight:600;
  font-family:inherit;resize:vertical;outline:none;transition:border-color .15s, box-shadow .15s;line-height:1.9;
}
textarea:focus{border-color:var(--line-h);box-shadow:0 0 0 3px rgba(110,168,255,.12)}
.tools{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
.searchbox{flex:1;min-width:170px;position:relative}
.searchbox svg{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--tx3);pointer-events:none}
[dir=ltr] .searchbox svg{right:auto;left:12px}
.searchbox input{
  width:100%;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:11px;
  color:var(--tx);padding:9px 36px 9px 12px;font-size:.86rem;font-family:inherit;outline:none;transition:.15s;
}
[dir=ltr] .searchbox input{padding:9px 12px 9px 36px}
.searchbox input:focus{border-color:var(--line-h)}
.tbtn{
  background:rgba(255,255,255,.05);color:var(--tx);border:1px solid var(--line);border-radius:11px;
  padding:9px 14px;font-size:.82rem;cursor:pointer;font-family:inherit;transition:.15s;white-space:nowrap;
  display:inline-flex;align-items:center;gap:6px;
}
.tbtn:hover{background:var(--card-h);border-color:var(--line-h)}
.tbtn.on{background:var(--grad);border-color:transparent;color:#0b0e1a;font-weight:700}
/* ── hint ── */
.hint{display:flex;align-items:center;gap:8px;color:var(--tx3);font-size:.78rem;margin:16px 2px 12px}
.hint .count{color:var(--ac);font-weight:800;font-size:.9rem}
.hint .dot{flex:1;height:1px;background:var(--line)}
/* ── font cards ── */
.font-box{
  -webkit-user-select:none;user-select:none;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:14px 16px;margin-bottom:9px;display:flex;align-items:center;gap:12px;
  cursor:pointer;transition:transform .14s, border-color .14s, background .14s;
  position:relative;overflow:hidden;
}
.font-box:hover{border-color:var(--line-h);background:var(--card-h);transform:translateY(-1px)}
.font-box::before{content:"";position:absolute;inset:0;background:var(--grad);opacity:0;transition:.2s;pointer-events:none}
.font-box.copied{border-color:rgba(63,185,80,.55)}
.font-box.copied::before{opacity:.07}
.font-box .txt{flex:1;font-size:1.15rem;word-break:break-word;line-height:2.1;position:relative;direction:ltr;text-align:left}
.font-box.rtl .txt{direction:rtl;text-align:right}
.font-box .copied-badge{position:absolute;top:8px;left:10px;color:var(--good);font-size:.72rem;font-weight:700;opacity:0;transition:.15s}
.font-box.copied .copied-badge{opacity:1}
.font-box .meta{display:flex;flex-direction:column;align-items:flex-end;gap:6px;position:relative}
[dir=ltr] .font-box .meta{align-items:flex-end}
.font-box .nm{color:var(--tx3);font-size:.68rem;white-space:nowrap;direction:inherit}
.font-box .star{
  background:transparent;border:none;color:var(--tx3);cursor:pointer;font-size:1rem;line-height:1;
  padding:2px;transition:.15s;font-family:inherit;
}
.font-box .star:hover{transform:scale(1.25)}
.font-box .star.on{color:#f5c518;text-shadow:0 0 10px rgba(245,197,24,.5)}
.font-box.webf{background:rgba(110,168,255,.05);border-color:rgba(110,168,255,.22)}
.font-box.webf .nm::before{content:"💎 ";color:var(--ac)}
@media(max-width:560px){
  .font-box{flex-wrap:wrap}
  .font-box .meta{flex-direction:row;align-items:center;gap:10px;width:100%;justify-content:flex-end}
  .font-box .nm{font-size:.62rem}
  .font-box .txt{font-size:1.02rem}
  .hero{padding-top:26px}
  .panel{padding:12px}
  .lang-btn{top:24px}
}
/* ── empty ── */
.empty{text-align:center;color:var(--tx3);padding:44px 0;font-size:.9rem}
.empty .e{font-size:2.2rem;display:block;margin-bottom:10px;filter:grayscale(.4)}
/* ── footer ── */
.foot{color:var(--tx3);font-size:.8rem;text-align:center;padding:26px 0 10px;line-height:2.2}
.foot a{color:var(--ac);text-decoration:none}
.foot a:hover{text-decoration:underline}
/* ── toast ── */
#toast{
  position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(90px);
  background:rgba(20,26,44,.92);border:1px solid var(--line-h);color:var(--tx);
  padding:11px 24px;border-radius:99px;font-size:.86rem;opacity:0;transition:.3s cubic-bezier(.2,.9,.3,1.3);
  pointer-events:none;z-index:99;backdrop-filter:blur(10px);box-shadow:0 12px 40px rgba(0,0,0,.5);
  display:flex;align-items:center;gap:8px;
}
#toast .ck{color:var(--good);font-weight:800}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
::-webkit-scrollbar{width:9px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:99px}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.2)}
::selection{background:rgba(110,168,255,.35)}
</style>
</head>

 Array.prototype.forEach.call(document.querySelectorAll("[data-i]"),function(el){el.innerHTML=t(el.getAttribute("data-i"))});
 Array.prototype.forEach.call(document.querySelectorAll("[data-ip]"),function(el){el.placeholder=t(el.getAttribute("data-ip"))});
 document.getElementById("lang").textContent=(lang==="fa"?"EN":"فارسی");
 var ip=document.getElementById("input");
 if(ip.value==="پناهان نت"||ip.value==="Panahanet")ip.value=t("default_text");
}

var mode="fa",input=document.getElementById("input"),list=document.getElementById("list"),
    q=document.getElementById("search"),favOnly=false;
var favs={};try{favs=JSON.parse(localStorage.getItem("fg_favs")||"{}")}catch(e){}
function saveFavs(){try{localStorage.setItem("fg_favs",JSON.stringify(favs))}catch(e){}}
function toast(m){var el=document.getElementById("toast");document.getElementById("toast-tx").textContent=m;el.classList.remove("show");void el.offsetWidth;el.classList.add("show");clearTimeout(el._h);el._h=setTimeout(function(){el.classList.remove("show")},1400)}
function copyText(s,msg){
 function fb(){var ta=document.createElement("textarea");ta.value=s;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");toast(msg||t("copied"))}catch(e){}document.body.removeChild(ta)}
 if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(s).then(function(){toast(msg||t("copied"))},fb)}else fb()
}
function applyMap(x,map){var out="";for(var i=0;i<x.length;i++){var c=x[i];out+=(map[c]!==undefined?map[c]:c)}return out}
function strToFancyFa(x){
 if(!x)return"";
 x=x.replace(/[آرزواذژد]/g,function(c){return c+"~~ "});
 x=x.replace(/ ک /g," ڪ ").replace(/ س /g," ๛ ").replace(/ی /g,"ے ").replace(/ه /g,"ـہ ");
 x=x.replace(/ ف /g," ف ").replace(/ ف/g," ؋ـ").replace(/ف /g,"ـ؋ ").replace(/ف/g,"ـ؋ـ");
 x=x.replace(/ د/g," ב").replace(/د/g,"ـב").replace(/ و /g," פּ ").replace(/ ن /g," ט ");
 return x.replace(/~~ /g,"")
}
function tashkeel(x,mk){return x.replace(/([^\s])/g,"$1"+mk)}
/* localized extra names */
var FA_EXTRA_NAMES={
 fa:["فارسی شکسته","تشدیددار","حرکت‌دار","اسلش‌دار","چسبیده","چسبیده شکسته"],
 en:["Broken Fancy","Tashdeed","Voweled","Slashed","Glued","Glued Broken"]};
var FA_DECOR={fa:"تزئینی ",en:"Decor "};
var EN_EXTRA_NAMES={
 fa:["برعکس","فاصله‌دار","برات تزئینی","تاج‌دار","ویکتوری"],
 en:["Flipped","Spaced","Brackets","Crowned","Victorian"]};

function buildFA(text){
 var res=[],i;
 for(i=0;i<WEBFA.length;i++)res.push({n:WEBFA[i][0],t:text,rtl:true,web:WEBFA[i][1],w:WEBFA[i][2]});
 for(i=0;i<FA.length;i++)res.push({n:(lang==="fa"?FA[i].name:(FA[i].en||FA[i].name)),t:applyMap(text,FA[i].map),rtl:true});
 var fancy=strToFancyFa(text);
 res.push({n:FA_EXTRA_NAMES[lang][0],t:fancy,rtl:true});
 res.push({n:FA_EXTRA_NAMES[lang][1],t:tashkeel(fancy,"ّ"),rtl:true});
 res.push({n:FA_EXTRA_NAMES[lang][2],t:tashkeel(fancy,"َِ"),rtl:true});
 res.push({n:FA_EXTRA_NAMES[lang][3],t:tashkeel(fancy,"̸"),rtl:true});
 res.push({n:FA_EXTRA_NAMES[lang][4],t:text.replace(/ /g,""),rtl:true});
 res.push({n:FA_EXTRA_NAMES[lang][5],t:fancy.replace(/ /g,""),rtl:true});
 for(var j=0;j<PAIRS.length;j++)res.push({n:FA_DECOR[lang]+(j+1),t:PAIRS[j][0]+fancy+PAIRS[j][1],rtl:true});
 return res
}
function buildEN(text){
 var res=[],i;
 for(i=0;i<WEBEN.length;i++)res.push({n:WEBEN[i][0],t:text,rtl:false,web:WEBEN[i][1],w:WEBEN[i][2]});
 for(i=0;i<EN.length;i++)res.push({n:(lang==="fa"?EN_FA[i]:(EN_EN[i]||EN_FA[i])),t:applyMap(text,EN[i]),rtl:false});
 var flipMap=EN[21],flipped="";
 for(var k=text.length-1;k>=0;k--){var ch=text[k].toLowerCase();flipped+=(flipMap[ch]!==undefined?flipMap[ch]:text[k])}
 res.push({n:EN_EXTRA_NAMES[lang][0],t:flipped,rtl:false});
 res.push({n:EN_EXTRA_NAMES[lang][1],t:text.toUpperCase().split("").join(" "),rtl:false});
 res.push({n:EN_EXTRA_NAMES[lang][2],t:"×͜× "+text+" ×͜×",rtl:false});
 res.push({n:EN_EXTRA_NAMES[lang][3],t:"༺ "+text+" ༻",rtl:false});
 res.push({n:EN_EXTRA_NAMES[lang][4],t:"✦•┈๑⋅⋯ "+text+" ⋯⋅๑┈•✦",rtl:false});
 return res
}
function render(){
 var text=input.value.trim()||"پناهان نت";
 var items=mode==="fa"?buildFA(text):buildEN(text);
 var query=q.value.trim().toLowerCase();
 var html="",vis=0,all=[];
 for(var i=0;i<items.length;i++){
  var it=items[i];
  if(!it.t||!it.t.trim())continue;
  all.push(it.t);
  if(favOnly&&!favs[mode+i])continue;
  if(query&&it.n.toLowerCase().indexOf(query)<0)continue;
  vis++;
  var star=favs[mode+i]?"on":"";
  html+='<div class="font-box'+(it.rtl?" rtl":"")+(it.web?' webf':'')+'" data-idx="'+i+'" '+(it.web?'style="font-family:'+it.web+';font-weight:'+(it.w||400)+'"':'')+'>'
      +'<div class="txt">'+it.t.replace(/</g,"&lt;")+'</div>'
      +'<span class="copied-badge">'+t("badge")+'</span><div class="meta"><button class="star '+star+'" data-k="'+(mode+i)+'" title="★">★</button><span class="nm">'+it.n+"</span></div></div>";
 }
 list.innerHTML=html||'<div class="empty"><span class="e">'+(favOnly?"⭐":"🔍")+'</span>'+(favOnly?t("empty_fav"):(query?t("empty_q")+'<br><button class="tbtn" style="margin-top:10px" onclick="switchTab()">'+t("try_other")+'</button>':t("empty_fav")))+'</div>';
 document.getElementById("cnt").textContent=vis;
 Array.prototype.forEach.call(list.querySelectorAll(".font-box"),function(el){
  el.addEventListener("click",function(ev){
   if(ev.target.classList.contains("star"))return;
   copyText(items[+el.dataset.idx].t);
   el.classList.add("copied");
   setTimeout(function(){el.classList.remove("copied")},900)
  })
 });
 Array.prototype.forEach.call(list.querySelectorAll(".star"),function(el){
  el.addEventListener("click",function(ev){
   ev.stopPropagation();
   var k=el.dataset.k;
   if(favs[k]){delete favs[k];el.classList.remove("on")}
   else{favs[k]=1;el.classList.add("on");toast(t("fav_add"))}
   saveFavs()
  })
 });
 list._all=all;
}
/* ── init ── */
document.getElementById("st-fa").textContent=buildFA("x").length;
document.getElementById("st-en").textContent=buildEN("x").length;
document.getElementById("b-fa").textContent=buildFA("x").length;
document.getElementById("b-en").textContent=buildEN("x").length;
document.getElementById("copyall").addEventListener("click",function(){
 var all=(list._all||[]).join("\n");
 copyText(all,t("copied_all"))
});
document.getElementById("favonly").addEventListener("click",function(){
 favOnly=!favOnly;this.classList.toggle("on",favOnly);render()
});
function switchTab(){mode=(mode==="fa"?"en":"fa");
 document.getElementById("tab-fa").classList.toggle("on",mode==="fa");
 document.getElementById("tab-en").classList.toggle("on",mode==="en");
 q.value="";render()}
document.getElementById("tab-fa").addEventListener("click",function(){mode="fa";this.classList.add("on");document.getElementById("tab-en").classList.remove("on");render()});
document.getElementById("tab-en").addEventListener("click",function(){mode="en";this.classList.add("on");document.getElementById("tab-fa").classList.remove("on");render()});
document.getElementById("lang").addEventListener("click",function(){
 lang=(lang==="fa"?"en":"fa");try{localStorage.setItem("fg_lang",lang)}catch(e){}
 applyLang();render()
});
input.addEventListener("input",render);
q.addEventListener("input",render);
applyLang();
render();
</script>
</body>
</html>

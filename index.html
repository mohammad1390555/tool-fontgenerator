<script>
"use strict";
var DATA=JSON.parse(document.getElementById("styles-data").textContent);
var EN=DATA.en,EN_NAMES=DATA.en_names,FA=DATA.fa,PAIRS=DATA.pairs;
var mode="fa",input=document.getElementById("input"),list=document.getElementById("list"),q=document.getElementById("search");
function toast(m){var t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(function(){t.classList.remove("show")},1200)}
function copyText(s){
 function fb(){var ta=document.createElement("textarea");ta.value=s;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");toast("کپی شد ✓")}catch(e){}document.body.removeChild(ta)}
 if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(s).then(function(){toast("کپی شد ✓")},fb)}else fb()
}
function applyMap(t,map){var out="";for(var i=0;i<t.length;i++){var c=t[i];out+=(map[c]!==undefined?map[c]:c)}return out}
/* EN */
function toEn(t,idx){return applyMap(t,EN[idx])}
/* FA extras */
function strToFancyFa(t){
 if(!t)return"";
 t=t.replace(/[آرزواذژد]/g,function(c){return c+"~~ "});
 t=t.replace(/ ک /g," ڪ ").replace(/ س /g," ๛ ").replace(/ی /g,"ے ").replace(/ه /g,"ـہ ");
 t=t.replace(/ ف /g," ف ").replace(/ ف/g," ؋ـ").replace(/ف /g,"ـ؋ ").replace(/ف/g,"ـ؋ـ");
 t=t.replace(/ د/g," ב").replace(/د/g,"ـב").replace(/ و /g," פּ ").replace(/ ن /g," ט ");
 return t.replace(/~~ /g,"")
}
function tashkeel(t,mk){return t.replace(/([^\s])/g,"$1"+mk)}
function buildFA(text){
 var res=[];
 for(var i=0;i<FA.length;i++)res.push({n:FA[i].name,t:applyMap(text,FA[i].map)});
 var fancy=strToFancyFa(text);
 res.push({n:"فارسی شکسته",t:fancy});
 res.push({n:"تشدیددار",t:tashkeel(fancy,"ّ")});
 res.push({n:"حرکت‌دار",t:tashkeel(fancy,"َِ")});
 res.push({n:"اسلش‌دار",t:tashkeel(fancy,"̸")});
 res.push({n:"چسبیده",t:text.replace(/ /g,"")});
 res.push({n:"چسبیده شکسته",t:fancy.replace(/ /g,"")});
 for(var j=0;j<PAIRS.length;j++)res.push({n:"تزئینی "+(j+1),t:PAIRS[j][0]+fancy+PAIRS[j][1]});
 return res
}
function buildEN(text){
 var res=[];
 for(var i=0;i<EN.length;i++)res.push({n:EN_NAMES[i]||("استایل "+(i+1)),t:toEn(text,i)});
 var flipMap=EN[21];
 var flipped="";for(var k=text.length-1;k>=0;k--){var ch=text[k].toLowerCase();flipped+=(flipMap[ch]!==undefined?flipMap[ch]:text[k])}
 res.push({n:"برعکس",t:flipped});
 res.push({n:"فاصله‌دار",t:text.toUpperCase().split("").join(" ")});
 res.push({n:"برات تزئینی",t:"×͜× "+text+" ×͜×"});
 res.push({n:"تاج‌دار",t:"༺ "+text+" ༻"});
 res.push({n:"ویکتوری",t:"✦•┈๑⋅⋯ "+text+" ⋯⋅๑┈•✦"});
 return res
}
function render(){
 var text=input.value.trim()||"پناهان نت";
 var items=mode==="fa"?buildFA(text):buildEN(text);
 var query=q.value.trim().toLowerCase();
 var html="",vis=0,all=[];
 for(var i=0;i<items.length;i++){
  var it=items[i];
  if(!it.t||!it.t.trim())continue;
  all.push(it.t);
  if(query&&it.n.toLowerCase().indexOf(query)<0)continue;
  vis++;
  html+='<div class="font-box" data-idx="'+i+'"><div class="txt">'+it.t.replace(/</g,"&lt;")+'</div><div class="nm">'+it.n+"</div></div>";
 }
 list.innerHTML=html||'<div class="empty">فونتی با این اسم پیدا نشد</div>';
 document.getElementById("cnt").textContent=vis;
 Array.prototype.forEach.call(list.querySelectorAll(".font-box"),function(el){
  el.addEventListener("click",function(){
   copyText(items[+el.dataset.idx].t);
   el.classList.add("copied");setTimeout(function(){el.classList.remove("copied")},700)
  })
 });
 list._all=all;
}
document.getElementById("copyall").addEventListener("click",function(){
 var all=(list._all||[]).join("\n");
 copyText(all);toast("همه استایل‌ها کپی شد ✓")
});
document.getElementById("tab-fa").addEventListener("click",function(){mode="fa";this.classList.add("on");document.getElementById("tab-en").classList.remove("on");render()});
document.getElementById("tab-en").addEventListener("click",function(){mode="en";this.classList.add("on");document.getElementById("tab-fa").classList.remove("on");render()});
input.addEventListener("input",render);
q.addEventListener("input",render);
render();
</script>
